name: Validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Check production environment contract
        env:
          NODE_ENV: production
          NEXT_PUBLIC_SITE_URL: https://www.landlsourdough.com
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
          SUPABASE_DB_URL: postgresql://user:pass@host:5432/db
          ADMIN_EMAILS: admin@landlsourdough.com
          BAKERY_EMAIL: orders@landlsourdough.com
          BAKERY_REVIEW_URL: https://g.page/r/CQUR-EBBDOgqECA/review
          RESEND_API_KEY: re_ci_key
          RESEND_FROM: "Luna & Lorelai's Sourdough <orders@landlsourdough.com>"
          STRIPE_SECRET_KEY: sk_test_ci
          STRIPE_WEBHOOK_SECRET: whsec_ci
          STRIPE_AUTOMATIC_TAX_ENABLED: "false"
          OPENAI_MODEL: gpt-5-mini
          DELIVERY_FEE_CENTS: "600"
          DELIVERY_ALLOWED_POSTAL_CODES: 30114,30115
          DELIVERY_SERVICE_AREA_COPY: Delivery available.
          GOOGLE_MAPS_API_KEY: ci-google-maps-key
          DELIVERY_ORIGIN_ADDRESS: 4501 Holly Springs Parkway, Canton, GA 30115
          DELIVERY_ROUTE_END_ADDRESS: 403 Three Branches Ct, Woodstock, GA 30188
          DELIVERY_MAX_DRIVE_MINUTES: "30"
          DELIVERY_FEE_BANDS: 0-10:500,11-20:700,21-30:1000
          BREAD_CLUB_PUBLIC_ENABLED: "false"
          BREAD_CLUB_TAX_STATUS: pending
          CRON_SECRET: ci-cron-secret-32-characters-long-0001
          BREAD_CLUB_SETUP_SECRET: ci-bread-club-setup-secret-32-chars-0002
          CLOUDFLARE_ORIGIN_SECRET: ci-cloudflare-origin-secret-32-chars-0003
        run: npm run check:prod-env -- --no-env-file

      - name: Run validation
        run: npm run validate
