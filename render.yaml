services:
  - type: web
    name: landl-sourdough
    runtime: node
    plan: standard
    repo: https://github.com/TailoredAgents/sourdough
    branch: main
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_SITE_URL
        value: https://www.landlsourdough.com
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION
        sync: false
      - key: NEXT_PUBLIC_BING_SITE_VERIFICATION
        sync: false
      - key: NEXT_PUBLIC_GA_MEASUREMENT_ID
        sync: false
      - key: NEXT_PUBLIC_GTM_ID
        sync: false
      - key: NEXT_PUBLIC_PLAUSIBLE_DOMAIN
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: SUPABASE_DB_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: "Luna & Lorelai's Sourdough <orders@landlsourdough.com>"
      - key: BAKERY_EMAIL
        sync: false
      - key: BAKERY_REVIEW_URL
        value: https://g.page/r/CQUR-EBBDOgqECA/review
      - key: OWNER_ALERTS_ENABLED
        value: "true"
      - key: OWNER_ALERT_EMAIL
        sync: false
      - key: OWNER_ALERT_SMS_EMAIL
        value: "4703880184@vtext.com"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_BILLING_PORTAL_CONFIGURATION_ID
        sync: false
      - key: STRIPE_AUTOMATIC_TAX_ENABLED
        value: "false"
      - key: BREAD_CLUB_PUBLIC_ENABLED
        value: "false"
      - key: BREAD_CLUB_TAX_STATUS
        value: pending
      - key: CRON_SECRET
        sync: false
      - key: BREAD_CLUB_SETUP_SECRET
        sync: false
      - key: CLOUDFLARE_ORIGIN_SECRET
        sync: false
      - key: DELIVERY_CENTER_LAT
        value: "34.2368"
      - key: DELIVERY_CENTER_LNG
        value: "-84.4908"
      - key: DELIVERY_RADIUS_MILES
        value: "12"
      - key: DELIVERY_FEE_CENTS
        value: "600"
      - key: DELIVERY_ALLOWED_POSTAL_CODES
        value: "30114,30115,30107,30183,30188,30189"
      - key: DELIVERY_SERVICE_AREA_COPY
        value: "Delivery is available in selected ZIP codes around Canton and Woodstock: 30114, 30115, 30107, 30183, 30188, and 30189."
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: DELIVERY_ORIGIN_ADDRESS
        value: "4501 Holly Springs Parkway, Canton, GA 30115"
      - key: DELIVERY_ROUTE_END_ADDRESS
        value: "403 Three Branches Ct, Woodstock, GA 30188"
      - key: DELIVERY_MAX_DRIVE_MINUTES
        value: "30"
      - key: DELIVERY_FEE_BANDS
        value: "0-10:500,11-20:700,21-30:1000"

  - type: cron
    name: landl-bread-club-daily
    runtime: node
    plan: starter
    repo: https://github.com/TailoredAgents/sourdough
    branch: main
    schedule: "7 * * * *"
    buildCommand: npm ci --omit=dev
    startCommand: npm run bread-club:daily
    envVars:
      - key: NEXT_PUBLIC_SITE_URL
        value: https://www.landlsourdough.com
      - key: CRON_SECRET
        sync: false
